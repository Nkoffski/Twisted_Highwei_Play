<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#08080b" />
  <title>TWISTED HIGHWAY</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      background: #08080b;
      color: #f4f4f8;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      touch-action: none;
    }
    #app {
      position: relative;
      width: 100%; height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #08080b;
    }
    #game-canvas {
      display: block;
      background: #08080b;
    }
    #ui-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .screen {
      position: relative;
      width: 100%;
      max-width: 520px;
      height: 100%;
      pointer-events: auto;
      display: flex;
      flex-direction: column;
      padding: max(14px, env(safe-area-inset-top, 14px)) 14px max(26px, env(safe-area-inset-bottom, 26px));
      overflow-y: auto;
      background-size: cover;
      background-position: center;
      background-color: #08080b;
    }
    .screen.overlay-dark {
      background: rgba(8, 8, 12, 0.84);
      backdrop-filter: blur(5px);
    }
    .bg-dim {
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(6,6,10,0.45) 0%, rgba(6,6,10,0.78) 100%);
      pointer-events: none;
      z-index: 0;
    }
    .screen > *:not(.bg-dim):not(.drag-el) { position: relative; z-index: 1; }

    /* Animated 5-frame vertical logo */
    .logo-anim {
      width: 100%;
      max-width: 310px;
      aspect-ratio: 1280 / 512;
      margin: 0 auto 6px;
      background-size: 100% 500%;
      background-repeat: no-repeat;
      background-position: 0% 0%;
      overflow: hidden;
      flex-shrink: 0;
      animation: logoShimmer 1.1s steps(1) infinite;
    }
    @keyframes logoShimmer {
      0%   { background-position: 0% 0%; }
      20%  { background-position: 0% 25%; }
      40%  { background-position: 0% 50%; }
      60%  { background-position: 0% 75%; }
      80%  { background-position: 0% 100%; }
      100% { background-position: 0% 0%; }
    }

    /* Sprite buttons (menu_buttons_spritesheet.png: 2 cols x 12 rows) */
    .sprite-btn {
      width: 100%;
      max-width: 316px;
      aspect-ratio: 704 / 144;
      margin: 0 auto;
      border: none;
      background-color: transparent;
      background-size: 200% 1200%;
      background-repeat: no-repeat;
      cursor: pointer;
      display: block;
      transition: transform 0.07s ease;
    }
    .sprite-btn:active { transform: scale(0.96); background-position-x: 100% !important; }
    .sprite-btn.disabled { opacity: 0.42; pointer-events: none; filter: grayscale(0.7); }

    /* Custom sprite buttons (custom_buttons_spritesheet.png: 2 cols x 3 rows) */
    .custom-btn {
      width: 100%;
      max-width: 316px;
      aspect-ratio: 704 / 144;
      margin: 0 auto;
      border: none;
      background-color: transparent;
      background-size: 200% 300%;
      background-repeat: no-repeat;
      cursor: pointer;
      display: block;
      transition: transform 0.07s ease;
    }
    .custom-btn:active { transform: scale(0.96); background-position-x: 100% !important; }
    .custom-btn.disabled { opacity: 0.48; pointer-events: none; filter: grayscale(0.65); }

    /* Extra sprite buttons (extra_buttons_spritesheet.png: 2 cols x 4 rows) */
    .extra-btn {
      width: 100%;
      max-width: 316px;
      aspect-ratio: 1117 / 337;
      margin: 0 auto;
      border: none;
      background-color: transparent;
      background-size: 200% 400%;
      background-repeat: no-repeat;
      cursor: pointer;
      display: block;
      transition: transform 0.07s ease;
    }
    .extra-btn:active { transform: scale(0.96); background-position-x: 100% !important; }
    .extra-btn.disabled { opacity: 0.4; pointer-events: none; filter: grayscale(0.7); }

    /* Single PNG game-over/result buttons (640x160) */
    .img-btn {
      width: 100%;
      max-width: 316px;
      aspect-ratio: 640 / 160;
      margin: 0 auto;
      border: none;
      background-color: transparent;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      cursor: pointer;
      display: block;
      transition: transform 0.07s ease;
    }
    .img-btn:active { transform: scale(0.96); filter: brightness(1.18); }

    /* Metallic dark-iron & crimson-rail button matching menu_buttons_spritesheet.png */
    .metal-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      max-width: 316px;
      margin: 0 auto;
      padding: 12px 16px;
      border-radius: 7px;
      border: 2px solid #525763;
      background: linear-gradient(180deg, #272b33 0%, #14171d 55%, #1d2028 100%);
      box-shadow: inset 0 1px 0 rgba(255,255,255,0.16), inset 6px 0 0 #d92632, inset -6px 0 0 #d92632, 0 4px 12px rgba(0,0,0,0.65);
      color: #f4f6fa;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      text-shadow: 0 2px 4px #000;
      cursor: pointer;
      transition: transform 0.07s ease, filter 0.07s ease;
    }
    .metal-btn:active {
      transform: scale(0.96);
      border-color: #ff4d4d;
      background: linear-gradient(180deg, #4b1820 0%, #240a0e 100%);
      box-shadow: inset 6px 0 0 #ff3b3b, inset -6px 0 0 #ff3b3b, 0 0 16px rgba(255, 55, 55, 0.45);
    }

    .pause-panel {
      width: 100%;
      max-width: 356px;
      margin: auto;
      padding: 22px 18px 20px;
      border-radius: 12px;
      border: 2px solid #5a5f6c;
      background: linear-gradient(180deg, rgba(24, 26, 34, 0.96) 0%, rgba(12, 13, 18, 0.97) 100%);
      box-shadow: inset 0 0 0 2px rgba(217, 38, 50, 0.45), 0 14px 40px rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 2px solid #444;
      background: linear-gradient(180deg, #2a2d3a, #191b24);
      color: #fff;
      font-size: 15px; font-weight: 800; letter-spacing: 0.5px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn:active { transform: scale(0.96); filter: brightness(1.15); }
    .btn.primary { border-color: #ff6b2b; background: linear-gradient(180deg, #d94618, #8c2208); }
    .btn.gold { border-color: #f5c542; background: linear-gradient(180deg, #c99414, #7a5406); color: #fff8dc; }
    .btn.danger { border-color: #e63946; background: linear-gradient(180deg, #a61c28, #5c0c14); }
    .btn.disabled, .btn:disabled { opacity: 0.42; pointer-events: none; }

    .row { display: flex; gap: 8px; align-items: center; }
    .col { display: flex; flex-direction: column; gap: 8px; }
    .card {
      background: rgba(18, 20, 28, 0.9);
      border: 1px solid rgba(255,255,255,0.16);
      border-radius: 12px;
      padding: 12px;
    }
    .currency-bar {
      display: flex; justify-content: space-between; align-items: center;
      background: rgba(0,0,0,0.76);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 6px 12px;
      margin-bottom: 6px;
      font-weight: 800;
    }
    .curr-item { display: flex; align-items: center; gap: 6px; font-size: 16px; }
    .curr-icon { width: 28px; height: 28px; object-fit: contain; display: block; }
    .title { text-align: center; font-size: 22px; font-weight: 900; letter-spacing: 1.5px; margin: 4px 0 8px; text-transform: uppercase; color: #ff7b3b; text-shadow: 0 2px 10px rgba(0,0,0,0.9); }
    .subtitle { font-size: 13px; color: #ccc; text-align: center; margin-bottom: 8px; }
    .stat-line { display: flex; justify-content: space-between; align-items: center; font-size: 13px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .upgrade-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.08); border-radius: 8px; margin-bottom: 5px; }
    .pips { display: flex; gap: 3px; }
    .pip { width: 14px; height: 10px; border-radius: 2px; background: #2c2c34; border: 1px solid #555; }
    .pip.filled { background: #ff7b3b; border-color: #ffb88c; }
    .gold-bonus { color: #ffd447; font-size: 20px; font-weight: 900; text-shadow: 0 0 10px rgba(255,212,71,0.5); }

    .lock-info-box {
      background: rgba(160, 26, 36, 0.28);
      border: 1px solid rgba(255, 110, 80, 0.55);
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 8px;
      font-size: 12px;
      line-height: 1.35;
      color: #ffd9cc;
      text-align: center;
    }
    .lock-info-box b { color: #ffd447; }

    .garage-stage {
      display: flex; align-items: center; justify-content: space-between;
      margin: 2px 0 6px;
    }
    .garage-car-preview {
      width: 162px; height: 162px;
      background-size: 500% 200%;
      background-repeat: no-repeat;
      position: relative;
      display: flex; align-items: center; justify-content: center;
    }
    .garage-arrow {
      width: 56px; height: 56px;
      border: none; background-color: transparent;
      background-size: 200% 200%;
      background-repeat: no-repeat;
      cursor: pointer;
    }
    .garage-arrow:active { transform: scale(0.9); filter: brightness(1.25); }

    .map-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
    .map-card {
      position: relative; border-radius: 10px; overflow: hidden;
      border: 2px solid #444; background: #181820; height: 124px;
      display: flex; flex-direction: column; justify-content: flex-end; padding: 8px;
      cursor: pointer;
    }
    .map-card.selected { border-color: #ff6b2b; box-shadow: 0 0 14px rgba(255,107,43,0.6); }
    .map-card.locked { opacity: 0.65; }
    .map-card img.map-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .map-card img.map-lock-icon { position: absolute; top: 50%; left: 50%; width: 58px; height: 58px; transform: translate(-50%, -58%); z-index: 2; object-fit: contain; }
    .map-card span { position: relative; z-index: 3; font-weight: 800; font-size: 13px; text-shadow: 0 2px 6px #000; }

    .slider-row { display: flex; flex-direction: column; gap: 4px; padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,0.08); }
    .slider-row input[type="range"] { width: 100%; accent-color: #ff6b2b; }

    /* Tilt sensor live meter in Settings */
    .tilt-subbox {
      background: rgba(10, 12, 20, 0.72);
      border: 1px solid rgba(255, 165, 60, 0.35);
      border-radius: 8px;
      padding: 8px 10px;
      margin-top: 4px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .tilt-meter-track {
      position: relative;
      width: 100%;
      height: 12px;
      border-radius: 6px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      overflow: hidden;
    }
    .tilt-meter-center {
      position: absolute;
      left: 50%; top: 0; bottom: 0;
      width: 2px;
      background: rgba(255,255,255,0.45);
      transform: translateX(-50%);
    }
    .tilt-meter-dot {
      position: absolute;
      top: 1px; bottom: 1px;
      width: 14px;
      border-radius: 5px;
      background: #ffd447;
      box-shadow: 0 0 8px #ffd447;
      left: 50%;
      transform: translateX(-50%);
    }

    /* Keybind rows for PC controls */
    .keybind-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 7px 0;
      border-bottom: 1px solid rgba(255,255,255,0.09);
      font-size: 13px;
    }
    .btn-keybind {
      min-width: 112px;
      padding: 7px 12px;
      border-radius: 7px;
      border: 1.5px solid #ff7b3b;
      background: rgba(255, 107, 43, 0.18);
      color: #fff;
      font-weight: 800;
      font-size: 12px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .btn-keybind.listening {
      border-color: #ffd447;
      background: rgba(255, 212, 71, 0.32);
      color: #ffd447;
    }

    /* Manual (Duke Nukem style codex) */
    .manual-scroll {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 2px;
      margin-bottom: 10px;
    }
    .manual-card {
      background: rgba(16, 18, 26, 0.92);
      border: 1px solid rgba(255, 107, 43, 0.38);
      border-left: 4px solid #d92632;
      border-radius: 10px;
      padding: 10px 12px;
    }
    .manual-card h3 {
      font-size: 14px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      color: #ffd447;
      margin-bottom: 6px;
    }
    .manual-card p, .manual-card li {
      font-size: 12.5px;
      line-height: 1.42;
      color: #e4e6ee;
    }
    .manual-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .manual-item:last-child { border-bottom: none; }
    .sprite-thumb {
      width: 44px;
      height: 44px;
      flex-shrink: 0;
      border-radius: 8px;
      background-color: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.16);
      background-repeat: no-repeat;
    }

    /* Intro video + overlaid bottom loading bar + delayed skip button */
    .intro-wrap {
      position: fixed; inset: 0; background: #000; z-index: 99;
      display: flex; align-items: center; justify-content: center;
      pointer-events: auto;
    }
    .intro-wrap video { width: 100%; height: 100%; object-fit: contain; background: #000; }
    .intro-bottom {
      position: absolute;
      left: 0; right: 0;
      bottom: max(22px, env(safe-area-inset-bottom, 22px));
      padding: 0 22px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      pointer-events: none;
    }
    .intro-load-box {
      width: 100%;
      max-width: 380px;
      text-align: center;
      background: rgba(0, 0, 0, 0.62);
      border-radius: 12px;
      padding: 10px 14px;
      border: 1px solid rgba(255, 123, 59, 0.45);
    }
    .intro-load-label {
      font-size: 13px;
      font-weight: 800;
      color: #fff;
      margin-bottom: 6px;
      text-shadow: 0 1px 4px #000;
    }
    .intro-load-track {
      width: 100%;
      height: 12px;
      background: rgba(0, 0, 0, 0.78);
      border: 1px solid #ff7b3b;
      border-radius: 7px;
      overflow: hidden;
    }
    .intro-load-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #ff4500, #ffb703);
      transition: width 0.12s linear;
    }
    .intro-skip {
      pointer-events: auto;
      align-self: flex-end;
      padding: 11px 20px; border-radius: 22px;
      background: rgba(12, 12, 18, 0.82); border: 1.5px solid rgba(255,255,255,0.55);
      color: #fff; font-weight: 800; font-size: 14px;
      cursor: pointer;
    }
    .intro-skip.hidden { display: none; }

    /* Large Harlequin emblem in Settings (no visual feedback on tap) */
    .settings-harlequin-zone {
      flex: 1;
      min-height: 110px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 6px 0 2px;
    }
    .settings-harlequin-img {
      width: min(52vw, 185px);
      height: min(52vw, 185px);
      max-height: 22vh;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    /* Resizable touch controls customizer — strictly position: absolute */
    #customizer-area {
      position: relative;
      overflow: hidden;
    }
    #customizer-area .drag-el {
      position: absolute !important;
      z-index: 5;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      transform: translate(-50%, 50%);
      touch-action: none;
      cursor: grab;
    }
    #customizer-area .drag-el.selected {
      z-index: 6;
      box-shadow: 0 0 0 4px #ffd447, 0 0 18px rgba(255, 212, 71, 0.75);
    }
    .resize-handle {
      position: absolute;
      right: -8px;
      bottom: -8px;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      background: #ffd447;
      color: #111;
      border: 2px solid #000;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 900;
      touch-action: none;
      cursor: nwse-resize;
    }
    #customizer-area .drag-el.selected .resize-handle {
      display: flex;
    }


    /* Garage Tabs & Tuning UI */
    .garage-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 8px;
    }
    .garage-tab {
      flex: 1;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1.5px solid #444a58;
      background: rgba(20, 22, 30, 0.9);
      color: #b8c0d0;
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      cursor: pointer;
    }
    .garage-tab.active {
      border-color: #ff6b2b;
      background: linear-gradient(180deg, rgba(217,70,24,0.9), rgba(120,28,8,0.9));
      color: #fff;
      box-shadow: 0 0 12px rgba(255, 107, 43, 0.35);
    }
    .garage-preview-canvas {
      width: 166px;
      height: 166px;
      display: block;
      margin: 0 auto;
    }
    .tuning-section {
      background: rgba(14, 16, 24, 0.9);
      border: 1px solid rgba(255,255,255,0.14);
      border-radius: 10px;
      padding: 9px 11px;
      margin-bottom: 7px;
    }
    .tuning-label {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 12px;
      font-weight: 800;
      color: #ffd447;
      margin-bottom: 6px;
      text-transform: uppercase;
    }
    .swatch-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }
    .swatch-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.35);
      cursor: pointer;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 900;
      color: #fff;
      background: #1c1f28;
      transition: transform 0.08s ease;
    }
    .swatch-btn:active { transform: scale(0.9); }
    .swatch-btn.active {
      border-color: #fff;
      box-shadow: 0 0 0 2px #ff7b3b, 0 0 10px rgba(255, 123, 59, 0.75);
      transform: scale(1.08);
    }
    .swatch-btn.custom-slot::after {
      content: '✎';
      position: absolute;
      right: -3px;
      bottom: -4px;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: #14161d;
      border: 1px solid #ffd447;
      color: #ffd447;
      font-size: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .scale-ctrl-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .scale-step-btn {
      width: 34px;
      height: 32px;
      border-radius: 7px;
      border: 1.5px solid #ff7b3b;
      background: rgba(255, 107, 43, 0.2);
      color: #fff;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      flex-shrink: 0;
    }
    .scale-step-btn:active { transform: scale(0.92); }

    .title-img { width: 88%; max-width: 320px; margin: 4px auto 8px; display: block; object-fit: contain; }
  </style>
  <script type="module" crossorigin src="./assets/index-BMfU5kXJ.js"></script>
</head>
<body>
  <div id="app">
    <canvas id="game-canvas"></canvas>
    <div id="ui-layer"></div>
  </div>
</body>
</html>
